<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aether Engine · 场景切换交互原型</title>
<style>
:root{color-scheme:dark;--bg:#111419;--panel:#1b2028;--raised:#232a34;--line:#343d49;--text:#edf2f8;--muted:#9ca8b7;--accent:#69a7ff;--warn:#f0b45d;--danger:#f07d79}
*{box-sizing:border-box}body{margin:0;background:#0c0f13;color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}
.app{width:min(1120px,100%);height:min(720px,calc(100vh - 56px));min-height:580px;border:1px solid #313945;border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:0 28px 90px #0009;position:relative}.top{height:48px;background:#191e25;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 18px;color:#c8d1dc}.brand{font-weight:700;letter-spacing:.04em;color:#fff}.crumb{color:#8491a2}.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 12px #f0b45d66}.body{height:calc(100% - 48px);display:grid;grid-template-columns:220px 1fr 250px}.side,.inspector{background:#161a20;padding:18px 14px;color:var(--muted)}.side{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.label{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#778496;margin:4px 8px 12px}.nav{padding:9px 10px;border-radius:6px;margin:3px 0}.nav.active{color:#eaf3ff;background:#273b54}.tree{padding:20px 9%;color:#abb7c7}.tree .scene{padding:9px 12px;background:#202a37;border:1px solid #344356;border-radius:6px;color:#e9f2fc;width:max-content}.viewport{position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 53%,#25313f 0,#171d25 38%,#12161b 75%)}.grid{position:absolute;inset:0;opacity:.2;background-image:linear-gradient(#586575 1px,transparent 1px),linear-gradient(90deg,#586575 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}.cube{width:104px;height:104px;transform:rotateX(-18deg) rotateY(33deg);background:linear-gradient(135deg,#85b7fa,#537da9);border:1px solid #b8d7fc;box-shadow:24px 28px 50px #0008;position:relative}.cube:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 48%,#fff2 49%,transparent 52%)}.modal-shade{position:absolute;inset:48px 0 0;background:#070a0ed1;display:grid;place-items:center;padding:20px}.dialog{width:min(500px,100%);background:#202630;border:1px solid #46515f;border-radius:12px;box-shadow:0 24px 75px #000b;overflow:hidden}.dialog-head{padding:22px 24px 0;display:flex;align-items:flex-start;gap:13px}.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:#4a3822;color:#ffc66f;font-size:19px;flex:none}.dialog h1{font-size:18px;line-height:1.3;margin:2px 0 7px;font-weight:650}.dialog p{margin:0;color:#b4bfce}.context{margin:18px 24px 0;background:#191e25;border:1px solid #333d49;border-radius:8px;padding:12px 14px}.context small{display:block;color:#8996a6;font-size:11px;letter-spacing:.07em;text-transform:uppercase}.context strong{display:block;margin-top:4px;font-size:13px;font-weight:550;color:#e5ebf2}.context .target{color:#9dc5ff}.hint{padding:14px 24px 18px;color:#8f9bab;font-size:12px}.buttons{border-top:1px solid #343d49;padding:14px 18px;display:flex;justify-content:flex-end;gap:9px;background:#1c222a}.btn{height:36px;min-width:94px;border-radius:6px;border:1px solid #45505e;background:#2a323d;color:#e8edf4;font:inherit;cursor:pointer;padding:0 14px}.btn:hover{background:#343f4c}.btn:focus{outline:2px solid #8dc1ff;outline-offset:2px}.btn.discard{border-color:transparent;background:transparent;color:#e3b77d}.btn.primary{background:#3976c5;border-color:#5793e7;color:white}.btn.primary:hover{background:#4688dc}.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#202a36;border:1px solid #415267;border-radius:8px;padding:10px 15px;box-shadow:0 8px 30px #0008;color:#dce9fa;display:none}.toast.show{display:block}.legend{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#8491a0;white-space:nowrap}
@media(max-width:760px){.body{grid-template-columns:155px 1fr}.inspector{display:none}.app{min-height:540px}.context{margin-top:14px}.hint{padding-bottom:12px}}
</style>
</head>
<body>
<main class="app" aria-label="Aether Engine editor mockup">
  <header class="top"><span class="brand">AETHER</span><span class="crumb">/</span><span>Project · Canyon Demo</span><span class="crumb">/</span><span>Scenes</span><span style="margin-left:auto" class="dot" title="有未保存更改"></span><span style="font-size:12px">Untitled · Modified</span></header>
  <div class="body"><aside class="side"><div class="label">Workspace</div><div class="nav">▦　Project</div><div class="nav">◉　Scene</div><div class="nav">▤　Log</div><div class="label" style="margin-top:28px">Project</div><div class="nav">▸　Assets</div><div class="nav">▾　Scenes</div><div class="nav active">　　level.ron</div></aside>
    <section class="viewport"><div class="grid"></div><div class="cube"></div><div class="legend">Viewport · Default Cube</div></section>
    <aside class="inspector"><div class="label">Inspector</div><div style="padding:10px 8px;color:#d1dbe7">Scene</div><div style="border-top:1px solid #303945;padding:14px 8px;color:#8f9bab">No object selected</div></aside></div>
  <div class="modal-shade" id="shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="description">
    <div class="dialog-head"><div class="icon">!</div><div><h1 id="title">保存场景更改？</h1><p id="description">继续之前，要保存对 <strong>Untitled</strong> 的更改吗？</p></div></div>
    <div class="context"><small>即将执行</small><strong class="target">打开场景　›　scenes/level.ron</strong></div>
    <div class="hint">保存成功后才会继续。取消保存或保存失败都会留在当前场景。</div>
    <div class="buttons"><button class="btn discard" id="discard">不保存</button><button class="btn" id="cancel">取消</button><button class="btn primary" id="save">保存</button></div>
  </section></div><div class="toast" id="toast" role="status"></div>
</main>
<script>
const shade=document.querySelector('#shade'),toast=document.querySelector('#toast');let focusIndex=1;const buttons=[document.querySelector('#discard'),document.querySelector('#cancel'),document.querySelector('#save')];
function message(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}
function close(text){shade.style.display='none';message(text)}
buttons[focusIndex].focus();
buttons[0].onclick=()=>close('已放弃更改，正在打开 scenes/level.ron…');
buttons[1].onclick=()=>close('已取消，当前场景和未保存更改保持不变。');
buttons[2].onclick=()=>message('模拟保存成功后，将继续打开 scenes/level.ron。');
document.addEventListener('keydown',e=>{if(shade.style.display==='none')return;if(e.key==='Escape'){e.preventDefault();buttons[1].click()}else if(e.key==='Enter'){e.preventDefault();document.activeElement.click()}else if(e.key==='Tab'){e.preventDefault();focusIndex=(focusIndex+(e.shiftKey?2:1))%3;buttons[focusIndex].focus()}});
</script>
</body>
</html>
