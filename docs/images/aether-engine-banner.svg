      <stop offset=".42" stop-color="#66c9c4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#66c9c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1600" height="470" rx="28" fill="url(#bg)"/>
