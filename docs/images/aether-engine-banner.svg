<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
  <title id="title">Aether Engine</title>
  <desc id="desc">Render, inspect, replay — a Rust real-time 3D engine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b29"/>
      <stop offset="0.58" stop-color="#172d3b"/>
      <stop offset="1" stop-color="#23464c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76d8ce" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#76d8ce" stop-opacity=".82"/>
      <stop offset="1" stop-color="#76d8ce" stop-opacity="0"/>
