<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Scene editing workflow</title>
  <desc id="desc">Open a RON scene, choose an entity in the hierarchy, edit it in the inspector or viewport, and save the scene.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68778B"/></marker></defs>
  <rect width="1200" height="330" rx="24" fill="#F4F6F8"/>
  <g font-family="Inter, SF Pro Display, Segoe UI, sans-serif">
    <text x="42" y="52" fill="#182334" font-size="25" font-weight="700">场景编辑工作流</text>
    <text x="42" y="80" fill="#67768A" font-size="15">场景文件与编辑器操作共用 ECS 场景状态。</text>
    <g stroke="#68778B" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M262 188h55"/><path d="M542 188h55"/><path d="M822 188h55"/></g>
    <g stroke-width="2">
      <rect x="42" y="126" width="220" height="120" rx="16" fill="#FFFFFF" stroke="#D9E0E8"/>
      <rect x="322" y="126" width="220" height="120" rx="16" fill="#EAF2FA" stroke="#C7D9EA"/>
      <rect x="602" y="126" width="220" height="120" rx="16" fill="#EAF5F3" stroke="#C7E3DC"/>
      <rect x="882" y="126" width="220" height="120" rx="16" fill="#FFF4E9" stroke="#EEDBC7"/>
    </g>
    <g text-anchor="middle" fill="#182334">
      <text x="152" y="169" font-size="17" font-weight="700">打开 RON 场景</text><text x="152" y="201" font-size="13" fill="#56657A">配置对象与环境</text>
      <text x="432" y="169" font-size="17" font-weight="700">Hierarchy 选择</text><text x="432" y="201" font-size="13" fill="#56657A">定位场景实体</text>
      <text x="712" y="169" font-size="17" font-weight="700">Inspector / Gizmo</text><text x="712" y="201" font-size="13" fill="#56657A">修改属性与变换</text>
      <text x="992" y="169" font-size="17" font-weight="700">保存 RON</text><text x="992" y="201" font-size="13" fill="#56657A">持久化场景更改</text>
    </g>
    <text x="600" y="292" text-anchor="middle" fill="#67768A" font-size="13">改动先写回场景数据；渲染 Extract 在下一帧读取更新后的状态。</text>
  </g>
</svg>
