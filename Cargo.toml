[workspace]
members = ["crates/aether-engine", "crates/aether-launcher"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ruochenhua"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruochenhua/AetherEngine"
rust-version = "1.78"

[workspace.dependencies]
# Core
wgpu = "0.19"
winit = "0.29"
hecs = "0.10"
glam = { version = "0.25", features = ["bytemuck"] }
bytemuck = { version = "1.14", features = ["derive"] }
half = "2"

# Window / Surface
raw-window-handle = "0.6"

# UI
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"

# Asset
gltf = { version = "1.4", features = ["names", "utils"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
tobj = { version = "4.0", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
yaml-rust2 = "0.8"

# Async / Runtime
pollster = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev dependencies
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
